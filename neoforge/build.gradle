plugins {
    id 'net.neoforged.moddev' version '2.0.113'
    id 'me.modmuss50.mod-publish-plugin'
}

repositories {
    maven { url 'https://maven.neoforged.net/releases' }
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
    runtimeClasspath.extendsFrom localRuntime
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers.from(rootProject.file('common/src/main/resources/META-INF/accesstransformer.cfg').absolutePath)

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', rootProject.file('common/src/generated/resources/').getAbsolutePath(),
                    '--existing', rootProject.file('common/src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly project(':common')
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')

    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinextras_version}"

    implementation "maven.modrinth:sophisticated-core:1.21.1-${sophisticated_core_version}"

    jarJar(implementation("com.github.umjammer:jlayer")) {
        version {
            strictly '[1.0.0,)'
            prefer project.jlayer_version
        }
    }
    additionalRuntimeClasspath("com.github.umjammer:jlayer:${jlayer_version}")

    jarJar(implementation("com.tianscar.javasound:jaad")) {
        version {
            strictly '[0.9.4,1.0)'
            prefer project.jaad_version
        }
    }
    additionalRuntimeClasspath("com.tianscar.javasound:jaad:${jaad_version}")
}

tasks.named('compileJava', JavaCompile) {
    dependsOn configurations.commonJava
    source configurations.commonJava
}

tasks.named('sourcesJar', Jar) {
    dependsOn configurations.commonJava
    from configurations.commonJava
}

tasks.named('processResources', ProcessResources) {
    dependsOn configurations.commonResources
    from configurations.commonResources
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version         : minecraft_version,
            minecraft_version_range   : minecraft_version_range,
            neo_version               : neo_version,
            neo_version_range         : neo_version_range,
            loader_version_range      : loader_version_range,
            mod_id                    : mod_id,
            mod_name                  : mod_name,
            mod_license               : mod_license,
            mod_version               : mod_version,
            mod_authors               : mod_authors,
            mod_description           : mod_description,
            sophisticated_core_version: sophisticated_core_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

publishMods {
    def changelogFile = rootProject.file("CHANGELOG.md")

    type = STABLE

    file = jar.archiveFile
    additionalFiles.from(sourcesJar.archiveFile)

    changelog = changelogFile.text

    version = project.version
    displayName = "$mod_name $project.version NeoForge"
    modLoaders.add("neoforge")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "491890"
        minecraftVersions.add(minecraft_version)

        clientRequired = true
        serverRequired = true

        optional "sophisticated-core"
    }

    github {
        repository = "jacksonhardaway/etched"
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        tagName = "mc$minecraft_version-$project.version-$project.name"
        commitish = "1.21.x"

        file.unset()
        file.unsetConvention()
        additionalFiles.unset()
        additionalFiles.unsetConvention()

        allowEmptyFiles = true
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "zi3Fnfmc"
        minecraftVersions.add(minecraft_version)

        optional "sophisticated-core"
    }

    dryRun = providers.environmentVariable("GITHUB_TOKEN").getOrNull() == null
}
